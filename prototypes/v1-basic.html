<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iron Steel – Prototype v0.1 (Basic)</title>
  <style>
    body { background:#1a1a1a; color:#eee; font-family:system-ui; display:flex; height:100vh; margin:0; }
    #side { width:260px; background:#222; padding:16px; border-right:2px solid #444; }
    canvas { background:#2a2a2a; border:3px solid #555; }
    button { background:#333; color:#eee; border:1px solid #666; padding:8px; margin:4px 0; cursor:pointer; width:100%; }
  </style>
</head>
<body>
  <div id="side">
    <h2>Iron Steel v0.1</h2>
    <p>Basic prototype – units, movement, simple reactive bot.</p>
    <p>Open the v0.2 file for the full version with buildings, research and diplomacy.</p>
    <button onclick="location.href='v2-full.html'">Go to v0.2</button>
  </div>
  <canvas id="c" width="800" height="500"></canvas>
  <script>
    // Minimal placeholder for v1 – the real early prototype logic lived here.
    // Full playable version is in v2-full.html
    const ctx = document.getElementById("c").getContext("2d");
    ctx.fillStyle = "#3a7bd5";
    ctx.fillRect(50,200,40,40);
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(700,200,40,40);
    ctx.fillStyle = "#eee";
    ctx.font = "16px sans-serif";
    ctx.fillText("v0.1 Basic Prototype (see v2-full.html for the playable version)", 120, 50);
  </script>
</body>
</html>
